<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Senac Tech - Meu Perfil</title>
		<link rel="stylesheet" type="text/css" href="../../statics/css/base.css">
		<link rel="stylesheet" type="text/css" href="../../statics/css/menu.css">
		<link rel="stylesheet" type="text/css" href="../../statics/css/usuario/usuario.css">
	</head>
	<body>
		<div id="header-component"></div>

		<hr>

		<main class="usuario-container">
			<h2>Meu Perfil</h2>
			<form id="form-perfil" class="form-usuario" novalidate>
				<div class="campo">
					<label for="nome">Nome completo</label>
					<input type="text" id="nome" name="nome" required>
				</div>

				<div class="campo">
					<label for="email">E-mail</label>
					<input type="email" id="email" name="email" required>
				</div>

				<div class="campo">
					<label for="celular">Celular</label>
					<input type="tel" id="celular" name="celular" placeholder="(xx) xxxxx-xxxx">
				</div>

				<p class="mensagem" id="mensagem-perfil" role="alert"></p>

				<div class="acoes">
					<button type="submit">Salvar alterações</button>
				</div>

				<div class="links-auxiliares">
					<a href="resetar-senha.html">Alterar senha</a>
				</div>
			</form>
		</main>

		<script src="../../statics/js/config.js"></script>
		<script src="../../statics/js/components.js"></script>

		<hr>
		<div id="footer-component"></div>
	<script src="../../statics/js/menu.js"></script>

	</body>
</html>
