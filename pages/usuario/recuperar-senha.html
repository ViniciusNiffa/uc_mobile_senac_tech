<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Senac Tech - Recuperar Senha</title>
		<link rel="stylesheet" type="text/css" href="../../statics/css/base.css">
		<link rel="stylesheet" type="text/css" href="../../statics/css/menu.css">
		<link rel="stylesheet" type="text/css" href="../../statics/css/usuario/usuario.css">
	</head>
	<body>
		<div id="header-component"></div>

		<hr>

		<main class="usuario-container">
			<h2>Recuperar Senha</h2>
			<p class="descricao">Informe o e-mail cadastrado. Vamos enviar um código de verificação para você redefinir sua senha.</p>
			<form id="form-recuperar-senha" class="form-usuario" novalidate>
				<div class="campo">
					<label for="email">E-mail</label>
					<input type="email" id="email" name="email" placeholder="nome@dominio.com" required>
				</div>

				<p class="mensagem" id="mensagem-recuperar" role="alert"></p>

				<div class="acoes">
					<button type="submit">Enviar código</button>
				</div>

				<div class="links-auxiliares">
					<a href="resetar-senha.html">Já tenho um código</a>
					<a href="login.html">Voltar para o login</a>
				</div>
			</form>
		</main>

		<script src="../../statics/js/config.js"></script>
		<script src="../../statics/js/components.js"></script>

		<hr>
		<div id="footer-component"></div>
	<script src="../../statics/js/menu.js"></script>

	</body>
</html>
