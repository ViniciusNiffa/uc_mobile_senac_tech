<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Senac Tech - Entrar</title>
		<link rel="stylesheet" type="text/css" href="../../statics/css/base.css">
		<link rel="stylesheet" type="text/css" href="../../statics/css/menu.css">
		<link rel="stylesheet" type="text/css" href="../../statics/css/usuario/usuario.css">
	</head>
	<body>
		<div id="header-component"></div>

		<hr>

		<main class="usuario-container">
			<h2>Entrar</h2>
			<form id="form-login" class="form-usuario" novalidate>
				<div class="campo">
					<label for="email">E-mail</label>
					<input type="email" id="email" name="email" placeholder="nome@dominio.com" required>
				</div>

				<div class="campo">
					<label for="senha">Senha</label>
					<input type="password" id="senha" name="senha" required>
				</div>

				<p class="mensagem" id="mensagem-login" role="alert"></p>

				<div class="acoes">
					<button type="submit">Entrar</button>
				</div>

				<div class="links-auxiliares">
					<a href="recuperar-senha.html">Esqueci minha senha</a>
					<a href="cadastro.html">Ainda não tenho conta</a>
				</div>
			</form>
		</main>

		<script src="../../statics/js/config.js"></script>
		<script src="../../statics/js/components.js"></script>

		<hr>
		<div id="footer-component"></div>
	<script src="../../statics/js/menu.js"></script>

	</body>
</html>
