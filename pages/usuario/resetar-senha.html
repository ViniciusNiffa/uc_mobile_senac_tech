<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Senac Tech - Redefinir Senha</title>
		<meta name="description" content="Redefina a senha da sua conta Senac Tech com o código recebido por e-mail.">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link rel="stylesheet" type="text/css" href="../../statics/css/base.css">
		<link rel="stylesheet" type="text/css" href="../../statics/css/menu.css">
		<link rel="stylesheet" type="text/css" href="../../statics/css/usuario/usuario.css">
	</head>
	<body>
		<div id="header-component"></div>

		<hr>

		<main class="usuario-container">
			<h2>Redefinir Senha</h2>
			<p class="descricao">Digite o código recebido por e-mail e escolha uma nova senha.</p>
			<form id="form-resetar-senha" class="form-usuario" novalidate>
				<div class="campo">
					<label for="email">E-mail</label>
					<input type="email" id="email" name="email" placeholder="nome@dominio.com" required>
				</div>

				<div class="campo">
					<label for="codigo">Código de verificação</label>
					<input type="text" id="codigo" name="codigo" maxlength="6" required>
				</div>

				<div class="campo">
					<label for="senha">Nova senha</label>
					<input type="password" id="senha" name="senha" required>
				</div>

				<p class="mensagem" id="mensagem-resetar" role="alert"></p>

				<div class="acoes">
					<button type="submit">Redefinir senha</button>
				</div>

				<div class="links-auxiliares">
					<a href="login.html">Voltar para o login</a>
				</div>
			</form>
		</main>

		<div id="footer-component"></div>

		<script src="../../statics/js/config.js"></script>
		<script src="../../statics/js/api.js"></script>
		<script src="../../statics/js/valida-resetar-senha.js"></script>
		<script src="../../statics/js/components.js"></script>
		<script src="../../statics/js/menu.js"></script>
	</body>
</html>
