<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Senac Tech - Criar Cadastro</title>
		<link rel="stylesheet" type="text/css" href="../../statics/css/base.css">
		<link rel="stylesheet" type="text/css" href="../../statics/css/menu.css">
		<link rel="stylesheet" type="text/css" href="../../statics/css/usuario/usuario.css">
	</head>
	<body>
		<div id="header-component"></div>
		
		<hr>

		<main class="usuario-container usuario-container--largo">
			<h2>Crie seu cadastro</h2>
			<p class="descricao">Todos os campos são obrigatórios.</p>

			<form id="form-cadastro" class="form-usuario form-usuario--grade" novalidate>
				<div class="campo">
					<label for="nome">Nome</label>
					<input type="text" id="nome" name="nome" required maxlength="30">
				</div>

				<div class="campo">
					<label for="sobrenome">Sobrenome</label>
					<input type="text" id="sobrenome" name="sobrenome" required maxlength="30">
				</div>

				<div class="campo">
					<label for="data-nascimento">Data de nascimento</label>
					<input type="date" id="data_nasc" name="data_nasc" required>
				</div>

				<div class="campo">
					<label for="data-nascimento">CEP</label>
					<input type="text" id="cep" name="cep" required>
				</div>

				<div class="campo">
					<label for="endereco">Rua</label>
					<input type="text" id="rua" name="rua" required maxlength="30">
				</div>

				<div class="campo">
					<label for="numero">Número</label>
					<input type="text" id="numero" name="numero" required inputmode="numeric" maxlength="5" placeholder="Ex: 123">
				</div>

				<div class="campo">
					<label for="bairro">Bairro</label>
					<input type="text" id="bairro" name="bairro" required>
				</div>

				<div class="campo">
					<label for="cidade">Cidade</label>
					<input type="text" id="cidade" name="cidade" required>
				</div>

				<div class="campo">
					<label for="estado">Estado</label>
					<select id="estado" name="estado" required>
						<option value="">Selecione o Estado (UF)</option>
						<option value="AC">Acre</option>
						<option value="AL">Alagoas</option>
						<option value="AP">Amapá</option>
						<option value="AM">Amazonas</option>
						<option value="BA">Bahia</option>
						<option value="CE">Ceará</option>
						<option value="DF">Distrito Federal</option>
						<option value="ES">Espírito Santo</option>
						<option value="GO">Goiás</option>
						<option value="MA">Maranhão</option>
						<option value="MT">Mato Grosso</option>
						<option value="MS">Mato Grosso do Sul</option>
						<option value="MG">Minas Gerais</option>
						<option value="PA">Pará</option>
						<option value="PB">Paraíba</option>
						<option value="PR">Paraná</option>
						<option value="PE">Pernambuco</option>
						<option value="PI">Piauí</option>
						<option value="RJ">Rio de Janeiro</option>
						<option value="RN">Rio Grande do Norte</option>
						<option value="RS">Rio Grande do Sul</option>
						<option value="RO">Rondônia</option>
						<option value="RR">Roraima</option>
						<option value="SC">Santa Catarina</option>
						<option value="SP">São Paulo</option>
						<option value="SE">Sergipe</option>
						<option value="TO">Tocantins</option>
					</select>
				</div>

				<div class="campo">
					<label for="cpf">CPF</label>
					<input type="text" id="cpf" name="cpf" required inputmode="numeric" maxlength="14">
				</div>

				<div class="campo">
					<label for="rg">RG</label>
					<input type="text" id="rg" name="rg" required inputmode="numeric" maxlength="12">
				</div>

				<div class="campo">
					<label for="celular">Celular</label>
					<input type="tel" id="celular" name="celular" required maxlength="15" placeholder="(xx) xxxxx-xxxx">
				</div>

				<div class="campo">
					<label for="email">E-mail</label>
					<input type="email" id="email" name="email" required placeholder="nome@dominio.com">
				</div>

				<div class="campo">
					<label for="usuario">Usuário</label>
					<input type="text" id="usuario" name="usuario" required>
				</div>

				<div class="campo">
					<label for="senha">Senha</label>
					<input type="password" id="senha" name="senha" required>
				</div>

				<div class="campo campo--completo">
					<label for="obs">Observação</label>
					<textarea id="obs" name="obs" rows="4"></textarea>
				</div>

				<p class="mensagem campo--completo" id="mensagem-cadastro" role="alert"></p>

				<div class="acoes campo--completo">
					<button type="submit">Cadastrar</button>
					<button type="reset">Limpar</button>
				</div>

				<div class="links-auxiliares campo--completo">
					<a href="login.html">Já tenho uma conta</a>
				</div>
			</form>
		</main>

		<script src="../../statics/js/config.js"></script>
		<script src="../../statics/js/api.js"></script>
		<script src="../../statics/js/auth-guard.js"></script>
		<script src="../../statics/js/mascaras.js"></script>
		<script src="../../statics/js/valida-cadastro.js"></script>
		<script src="../../statics/js/components.js"></script>

		<hr>
		<div id="footer-component"></div>
	<script src="../../statics/js/menu.js"></script>

</body>
</html>
