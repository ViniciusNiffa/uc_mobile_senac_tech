<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Senac Tech - Meu Painel</title>
		<meta name="description" content="Gerencie seu perfil e acompanhe seus cursos no Senac Tech.">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link rel="stylesheet" type="text/css" href="../../statics/css/base.css">
		<link rel="stylesheet" type="text/css" href="../../statics/css/menu.css">
		<link rel="stylesheet" type="text/css" href="../../statics/css/usuario/usuario.css">
	</head>
	<body>
		<div id="header-component"></div>

		<main class="usuario-container painel-area">
			<h2>Meu Perfil</h2>

			<div class="acoes">
				<button
				type="button"
				onclick="window.location.href='../editar-usuario.html'">
				Editar meu perfil
				</button>
			</div>

			<div class="perfil-card">
				<div class="foto-perfil">
					<img src="../../statics/img/icons/user-placeholder.png" alt="Foto de Perfil" id="img-perfil">
					<input type="file" id="upload-foto" accept="image/*">
				</div>

				<form id="form-perfil" class="form-usuario" novalidate>
					<div class="campo">
						<label for="nome">Nome Completo</label>
						<input type="text" id="nome" name="nome" required autocomplete="name">
					</div>

					<div class="campo">
						<label for="email">E-mail</label>
						<input type="email" id="email" name="email" required autocomplete="email" readonly>
					</div>

					<div class="campo">
						<label for="telefone">Telefone</label>
						<input type="tel" id="telefone" name="telefone" autocomplete="tel" placeholder="(xx) xxxxx-xxxx">
					</div>

					<div class="campo">
						<label for="senha">Nova Senha <small style="font-weight:400;color:var(--cor-neutra-500)">(deixe em branco para não alterar)</small></label>
						<input type="password" id="senha" name="senha" autocomplete="new-password">
					</div>

					<p class="mensagem" id="mensagem-perfil" role="alert"></p>

					<div class="acoes">
						<button type="submit">Salvar Alterações</button>
						<button type="button" id="btn-logout" class="btn-perigo">Sair</button>
					</div>
				</form>
			</div>
		</main>

		<div id="footer-component"></div>

		<script src="../../statics/js/config.js"></script>
		<script src="../../statics/js/api.js"></script>
		<script src="../../statics/js/auth-guard.js"></script>
		<script src="../../statics/js/painel-usuario.js"></script>
		<script src="../../statics/js/components.js"></script>
		<script src="../../statics/js/menu.js"></script>
	</body>
</html>
