<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Senac Tech - Verificar E-mail</title>
		<link rel="stylesheet" type="text/css" href="../../statics/css/base.css">
		<link rel="stylesheet" type="text/css" href="../../statics/css/menu.css">
		<link rel="stylesheet" type="text/css" href="../../statics/css/usuario/usuario.css">
	</head>
	<body>
		<div id="header-component"></div>

		<hr>

		<main class="usuario-container">
			<h2>Verificar E-mail</h2>
			<p class="descricao">Enviamos um código de verificação para o seu e-mail. Digite-o abaixo para ativar sua conta.</p>
			<form id="form-verificar-email" class="form-usuario" novalidate>
				<div class="campo">
					<label for="codigo">Código de verificação</label>
					<input type="text" id="codigo" name="codigo" maxlength="6" required>
				</div>

				<p class="mensagem" id="mensagem-verificar" role="alert"></p>

				<div class="acoes">
					<button type="submit">Verificar</button>
				</div>

				<div class="links-auxiliares">
					<a href="#" id="reenviar-codigo">Reenviar código</a>
				</div>
			</form>
		</main>

		<script src="../../statics/js/config.js"></script>
		<script src="../../statics/js/components.js"></script>

		<hr>
		<div id="footer-component"></div>
	<script src="../../statics/js/menu.js"></script>

	</body>
</html>
