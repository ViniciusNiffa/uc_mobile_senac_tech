<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Senac Tech - Painel Administrativo</title>
		<meta name="description" content="Painel de administração do Senac Tech — gerenciamento de usuários.">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link rel="stylesheet" type="text/css" href="../statics/css/base.css">
		<link rel="stylesheet" type="text/css" href="../statics/css/menu.css">
		<link rel="stylesheet" type="text/css" href="../statics/css/admin/admin.css">
		<script src="../statics/js/components.js" defer></script>
	</head>
	<body>
		<div id="header-component"></div>

		<main class="admin-container">
			<div class="admin-header">
				<h2>
    				Painel Administrativo
    				<span id="badge-total">0</span>
				</h2>
				<div class="admin-header__acoes">
					<a href="usuario/cadastro.html?admin=1" class="btn-add" id="btn-novo-usuario">
						+ Novo Usuário
					</a>
					<button id="btn-logout-admin" class="btn-admin-sair">Sair</button>
				</div>
			</div>

			<div class="admin-card">
				<div class="admin-table-wrapper">
					<table id="tabela-usuarios">
						<thead>
							<tr>
								<th>ID</th>
								<th>Nome</th>
								<th>E-mail</th>
								<th>Perfil</th>
								<th>Ações</th>
							</tr>
						</thead>
						<tbody id="lista-usuarios">
							<tr>
								<td colspan="5">
									<div class="tabela-vazia">
										<p>Carregando usuários...</p>
									</div>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</main>

		<div id="footer-component"></div>

		<script src="../statics/js/config.js"></script>
		<script src="../statics/js/api.js"></script>
		<script src="../statics/js/auth-guard.js"></script>
		<script src="../statics/js/menu.js"></script>
		<script>
			// Painel Admin — listagem de usuários via user_service
			document.addEventListener('DOMContentLoaded', async () => {
				const tbody   = document.getElementById('lista-usuarios');
				const badge   = document.getElementById('badge-total');
				const btnSair = document.getElementById('btn-logout-admin');

				// Logout
				if (btnSair) {
					btnSair.addEventListener('click', () => API.logout('../index.html'));
				}

				// Busca usuários no user_service
				try {
					const res = await fetch(`${APP_CONFIG.USER_URL}/users`, {
						headers: { 'Authorization': `Bearer ${localStorage.getItem('senac_token')}` }
					});

					if (!res.ok) {
						const erro = await res.json().catch(() => ({}));

						throw new Error(
							erro.error ||
							erro.message ||
							`Erro HTTP ${res.status}`
						);
					}
					const usuarios = await res.json();

					if (!Array.isArray(usuarios) || usuarios.length === 0) {
						tbody.innerHTML = `<tr><td colspan="5"><div class="tabela-vazia"><p>Nenhum usuário encontrado.</p></div></td></tr>`;
						badge.textContent = '0';
						return;
					}

					badge.textContent = usuarios.length;
					tbody.innerHTML = usuarios.map(u => `
						<tr>
							<td class="td-id">#${u.id}</td>
							<td><strong>${escHtml(u.nome || u.primeiro_nome || '—')}</strong></td>
							<td>${escHtml(u.email || '—')}</td>
							<td>
								<span class="badge-role badge-role--${u.role === 'admin' ? 'admin' : 'user'}">
									${u.role === 'admin' ? 'Admin' : 'Aluno'}
								</span>
							</td>
							<td>
								<div class="acoes-tabela">
									<a class="btn-acao btn-editar" href="editar-usuario.html?id=${u.id}">Editar</a>
									<button class="btn-acao btn-excluir" onclick="excluirUsuario(${u.id})">Excluir</button>
								</div>
							</td>
						</tr>
					`).join('');
				} catch (err) {
					console.error('Erro ao carregar usuários:', err);
					tbody.innerHTML = `
						<tr>
							<td colspan="5">
								<div class="tabela-vazia">
									<p>${escHtml(err.message)}</p>
								</div>
							</td>
						</tr>
					`;
					badge.textContent = '!';
				}
			});

			// Escapa HTML para evitar XSS na tabela
			function escHtml(str) {
				return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
			}


async function excluirUsuario(id) {
    const confirmou = confirm(
        `Deseja realmente excluir o usuário #${id}?`
    );

    if (!confirmou) return;

    const token = localStorage.getItem('senac_token');

    try {
        const resposta = await fetch(
            `${APP_CONFIG.AUTH_URL}/accounts/${id}`,
            {
                method: 'DELETE',
                headers: {
                    Authorization: `Bearer ${token}`
                }
            }
        );

        const resultado = await resposta.json();

        if (!resposta.ok) {
            throw new Error(
                resultado.error ||
                'Não foi possível excluir o usuário.'
            );
        }

        alert('Usuário excluído com sucesso!');
        window.location.reload();

    } catch (erro) {
        alert(erro.message);
    }
}
		</script>
	</body>
</html>
